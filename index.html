<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Assistant</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Study Assistant</h1>
            <p>Student Helper</p>

            <div class="auth-tabs">
                <button class="tab-btn active" id="login-tab">Login</button>
                <button class="tab-btn" id="register-tab">Register</button>
            </div>

            <form id="login-form" class="auth-form active">
                <input type="text" placeholder="Username" id="login-username" required>
                <input type="password" placeholder="Password" id="login-password" required>
                <button type="submit">Login</button>
                <div class="error-message" id="login-error"></div>
            </form>

            <form id="register-form" class="auth-form">
                <input type="text" placeholder="Username" id="register-username" required>
                <input type="password" placeholder="Password" id="register-password" required>
                <input type="password" placeholder="Confirm password" id="register-confirm" required>
                <button type="submit">Register</button>
                <div class="error-message" id="register-error"></div>
            </form>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <span>© 2026 Study Assistant</span>
            <span>📞 +7 (933) 234-50-04</span>
            <a href="https://t.me/freezqwx" target="_blank" class="telegram-link">
                <i class="fab fa-telegram-plane"></i> @freezqwx
            </a>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/apply-theme.js"></script>
</body>
</html>
