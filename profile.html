<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Study Assistant</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
            <h1>My Profile</h1>
            <div></div>
        </div>

        <div class="profile-card">
            <div class="avatar-wrapper">
                <div class="avatar-container">
                    <img id="profile-avatar-preview" src="" alt="Avatar" class="profile-avatar">
                    <div class="avatar-overlay">
                        <i class="fas fa-camera"></i>
                        <span>Change photo</span>
                    </div>
                    <input type="file" id="avatar-upload" accept="image/*" hidden>
                </div>
            </div>

            <div class="profile-form">
                <div class="form-row">
                    <div class="input-group">
                        <label><i class="fas fa-user"></i> First Name</label>
                        <input type="text" id="first-name" class="profile-input" placeholder="Enter your first name">
                    </div>
                    <div class="input-group">
                        <label><i class="fas fa-user-tag"></i> Last Name</label>
                        <input type="text" id="last-name" class="profile-input" placeholder="Enter your last name">
                    </div>
                </div>

                <div class="input-group">
                    <label><i class="fas fa-info-circle"></i> About me</label>
                    <textarea id="bio" rows="4" class="profile-input" placeholder="Tell something about yourself..."></textarea>
                </div>

                <div class="settings-card">
                    <h3><i class="fas fa-cog"></i> Settings</h3>
                    <div class="theme-selector-wrapper">
                        <label for="theme-selector-profile">Color theme:</label>
                        <select id="theme-selector-profile" class="theme-select-profile">
                            <option value="light">🌞 Light</option>
                            <option value="dark-theme">🌚 Dark</option>
                            <option value="forest-theme">🌲 Forest</option>
                            <option value="ocean-theme">🌊 Ocean</option>
                            <option value="sunset-theme">🌅 Sunset</option>
                        </select>
                    </div>
                </div>

                <div class="profile-actions">
                    <button id="save-profile" class="btn-primary btn-ripple">
                        <i class="fas fa-save"></i> Save
                    </button>
                    <button id="cancel-profile" class="btn-secondary btn-ripple">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <span>© 2026 Study Assistant</span>
            <span>📞 +7 (933) 234-50-04</span>
            <a href="https://t.me/freezqwx" target="_blank" class="telegram-link">
                <i class="fab fa-telegram-plane"></i> @freezqwx
            </a>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
